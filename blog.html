<head>

    <meta name="description" content="Insights on web development, SEO, performance optimization, and digital marketing from Aethera Digital's team of experts.">
    <link rel="canonical" href="https://aethera-solutions.vercel.app/blog.html">
    <meta property="og:title" content="Blog | Aethera Digital">
    <meta property="og:description" content="Insights on web development, SEO, performance optimization, and digital marketing from Aethera Digital's team of experts.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aethera-solutions.vercel.app/blog.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { padding: 160px 0 80px; text-align: center; }
        .page-hero-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; color: var(--color-primary); margin-bottom: 24px; }
        .page-hero-title { font-family: var(--font-heading); font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; }
        .page-hero-sub { font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto; }
        .blog-section { padding: 60px 0 120px; }
        .blog-layout { display: grid; grid-template-columns: 1fr 320px; gap: 48px; align-items: start; }
        .featured-post { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); overflow: hidden; margin-bottom: 32px; transition: var(--transition-smooth); }
        .featured-post:hover { transform: translateY(-4px); border-color: rgba(0,242,254,0.3); }
        .featured-img { height: 280px; position: relative; overflow: hidden; }
        .featured-img-bg { width: 100%; height: 100%; transition: transform 0.5s ease; }
        .featured-post:hover .featured-img-bg { transform: scale(1.04); }
        .featured-body { padding: 36px; }
        .post-meta { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .post-cat { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-primary); padding: 4px 12px; border-radius: 50px; background: rgba(0,242,254,0.08); border: 1px solid rgba(0,242,254,0.2); }
        .post-date { font-size: 0.8rem; color: var(--text-muted); }
        .post-title { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        .post-title a { text-decoration: none; color: var(--text-main); transition: var(--transition-smooth); }
        .post-excerpt { font-size: 0.95rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 24px; }
        .posts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .blog-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); overflow: hidden; transition: var(--transition-smooth); }
        .blog-card-body { padding: 24px; }
        .blog-card-title { font-family: var(--font-heading); font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
        .read-more { font-size: 0.85rem; font-weight: 600; color: var(--color-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .sidebar { display: flex; flex-direction: column; gap: 28px; }
        .sidebar-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius-lg); padding: 28px; }
        .sidebar-title { font-family: var(--font-heading); font-size: 1rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .category-list { display: flex; flex-direction: column; gap: 10px; }
        .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tags-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-pill { font-size: 0.78rem; padding: 5px 12px; border-radius: 50px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); color: var(--text-muted); }
        @media (max-width: 1024px) { .blog-layout { grid-template-columns: 1fr; } .sidebar { display: grid; grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .page-hero-title { font-size: 2.5rem; } .posts-grid { grid-template-columns: 1fr; } .sidebar { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

                    <li><a href="blog.html" class="nav-link active">Blog</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-actions">

                    <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
                </button>
            </div>
        </div>
    </header>

    <div class="mobile-nav-overlay" id="mobile-overlay">
        <nav class="mobile-nav-links">
            <a href="services.html" class="mobile-link">Services</a>
            <a href="about.html" class="mobile-link">About</a>

                </div>
            </div>
        </section>

    <footer class="site-footer">
        <div class="footer-bottom">
